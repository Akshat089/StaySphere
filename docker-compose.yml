services:
  postgres:
    image: postgres:16
    container_name: staysphere_postgres_new
    environment:
      POSTGRES_USER: staysphere
      POSTGRES_PASSWORD: staysphere
      POSTGRES_DB: user_db
      TZ: Etc/UTC
      PGTZ: Etc/UTC
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
  redis:
    image: redis:7
    container_name: staysphere_redis
    ports:
      - "6379:6379"
volumes:
  postgres_data_new:
