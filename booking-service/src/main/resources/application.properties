spring.application.name=booking-service
server.port=8084
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/booking_db?options=-c%20TimeZone=UTC
spring.datasource.username=staysphere
spring.datasource.password=staysphere

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
jwt.secret=ThisIsAReallyLongSecretKeyForStaySphereJwtAuth123456789
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic.booking-events=booking-events