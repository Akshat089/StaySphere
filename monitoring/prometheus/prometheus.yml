global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8088']

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8081']

  - job_name: property-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['property-service:8082']

  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['search-service:8083']

  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['booking-service:8084']

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8085']

  - job_name: review-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['review-service:8086']

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8087']
